name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: DeepSeek Harness configuration compatibility
        run: npm run dsh:config
      - name: Verify catalog implementation or bootstrap bundle
        run: |
          if test -f projects/catalog-consolidation/project.json; then
            npm --prefix projects/catalog-consolidation ci
            npm --prefix projects/catalog-consolidation run check
          else
            printf '%s  %s\n' '0017ba10da2756e5e70974a4c5f6ab437f84cbbb6c9adef512b8701fe50e34c2' catalog-consolidation-sdd-specs.zip | sha256sum --check -
            unzip -t catalog-consolidation-sdd-specs.zip
            npm run project:create -- --id catalog-consolidation --title "VTEX Catalog Consolidation"
            unzip -o catalog-consolidation-sdd-specs.zip -d .
            npm run project:validate -- --project catalog-consolidation --working-tree
          fi
      - name: Verify reusable SDD engine
        run: npm run check
      - run: git diff --check
