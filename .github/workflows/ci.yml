name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: DeepSeek Harness configuration compatibility
        run: npm run dsh:config
      - name: Verify versioned specs and materialized projects
        run: |
          for spec_dir in specs/*; do
            test -d "${spec_dir}" || continue
            project_id="$(basename "${spec_dir}")"
            project_dir="projects/${project_id}"
            project_title="$(node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(value.name)' "${spec_dir}/project.json")"

            if ! test -f "${project_dir}/project.json"; then
              npm run project:create -- --id "${project_id}" --title "${project_title}"
              cp -R "${spec_dir}/." "${project_dir}/"
            fi

            npm run project:validate -- --project "${project_id}" --working-tree

            if test -f "${project_dir}/package-lock.json"; then
              npm run project:sources -- --project "${project_id}"
              npm --prefix "${project_dir}" ci
              npm --prefix "${project_dir}" run check
            fi
          done
      - name: Verify reusable SDD engine
        run: npm run check
      - run: git diff --check
