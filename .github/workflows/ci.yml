name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install catalog project dependencies
        run: npm --prefix projects/catalog-consolidation ci
      - name: DeepSeek Harness configuration compatibility
        run: npm run dsh:config
      - name: Verify reusable SDD engine
        run: npm run check
      - name: Verify catalog consolidation project
        run: npm --prefix projects/catalog-consolidation run check
      - run: git diff --check
