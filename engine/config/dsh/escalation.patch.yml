- id: agent-default-model
  config:
    provider: openai
    model: gpt-5.6-sol

- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
        reasoning: high
        cacheRetention: short
        models:
          - id: gpt-5.6-luna
            contextWindow: 272000
            maxTokens: 16384
          - id: gpt-5.6-terra
            contextWindow: 272000
            maxTokens: 16384
          - id: gpt-5.6-sol
            contextWindow: 272000
            maxTokens: 16384
        retryPolicy:
          mode: normal
          maxRetries: 2
